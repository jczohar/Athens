<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--blue:#0d47a1;--blue2:#1976d2;--gold:#f5c542;--ink:#1b2a41;--mut:#5b6b82;--bg:#eef4fb;--card:#fff;--cc:#1976d2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;background:linear-gradient(180deg,#e3f0ff 0%,#f7fbff 40%,#fff6e6 100%);color:var(--ink);direction:rtl;min-height:100vh;padding-bottom:72px}
a{color:#0b57d0;text-decoration:none}
button{font:inherit;cursor:pointer}
/* header */
.top{position:sticky;top:0;z-index:1000;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(90deg,#0a2f73,#1565c0 55%,#0a2f73);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.credit{flex:1;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gold{font-weight:800;background:linear-gradient(180deg,#fff2a8,#f5c542 45%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 1px rgba(255,215,0,.5)}
.iconbtn{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:32px;height:32px;font-size:16px;display:grid;place-items:center}
.iconbtn:active{transform:scale(.92)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* tabs */
.tabs{position:sticky;top:88px;z-index:999;display:flex;gap:6px;overflow-x:auto;padding:8px 8px 6px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 2px 6px rgba(0,0,0,.08);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
/* desktop only: thin horizontal scrollbar under the menu */
@media (min-width: 700px) {
  .tabs{scrollbar-width:thin;scrollbar-color:#90caf9 transparent;padding-bottom:4px}
  .tabs::-webkit-scrollbar{display:block;height:6px}
  .tabs::-webkit-scrollbar-track{background:transparent;border-radius:6px}
  .tabs::-webkit-scrollbar-thumb{background:#90caf9;border-radius:6px}
  .tabs::-webkit-scrollbar-thumb:hover{background:#64b5f6}
}
.tab{flex:0 0 auto;border:0;border-radius:20px;padding:7px 13px;font-size:14px;font-weight:700;color:#fff;background:var(--tc);opacity:.78;display:flex;align-items:center;gap:5px}
.tab.on{opacity:1;box-shadow:0 3px 10px rgba(0,0,0,.28);transform:translateY(-1px);outline:2px solid #fff}
main{max-width:980px;margin:0 auto;padding:10px}
.hero{border-radius:18px;padding:14px 16px;color:#fff;background:linear-gradient(120deg,var(--cc),#0d47a1);margin-bottom:10px;box-shadow:0 6px 16px rgba(0,0,0,.15);position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:21px}.hero p{margin:0;opacity:.95;font-size:14px;line-height:1.5}
.hero:after{content:"";position:absolute;inset:auto -20px -30px auto;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
/* filters */
.fbar{background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.fbar input[type=search],.fbar input[type=text],.fbar select,.f input,.f select{width:100%;padding:9px 12px;border:1.5px solid #cfe0f5;border-radius:10px;font:inherit;background:#f8fbff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid #c8d9ef;background:#fff;border-radius:16px;padding:4px 11px;font-size:13px;color:#274060}
.chip.on{background:var(--cc);border-color:var(--cc);color:#fff;font-weight:700}
.count{font-size:12px;color:var(--mut);margin:2px 4px 8px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(20,40,80,.12);border-top:5px solid var(--cc);display:flex;flex-direction:column}
.card.hid{opacity:.5}
.ph{height:165px;background:linear-gradient(135deg,var(--cc),#ffd36b);display:grid;place-items:center;position:relative;overflow:hidden}
.ph .emo{font-size:48px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .cr{position:absolute;bottom:4px;left:6px;font-size:10px;background:rgba(0,0,0,.45);color:#fff;border-radius:8px;padding:1px 6px}
.body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{margin:0;font-size:17px;line-height:1.3}
.card h3 small{display:block;font-size:12px;color:var(--mut);font-weight:500;direction:ltr;text-align:right}
.short{margin:0;font-size:14px;line-height:1.5;color:#33475f}
.tag{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;background:#e8f1ff;color:#1b4a8f}
.tag.g{background:#e3f8e8;color:#166534}.tag.o{background:#fff0d9;color:#8a4b00}.tag.r{background:#ffe5e5;color:#9b1c1c}.tag.p{background:#f1e6ff;color:#5b21b6}
.row{display:flex;flex-wrap:wrap;gap:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.btn{border:0;border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700;color:#fff;background:var(--cc);display:inline-flex;gap:4px;align-items:center}
.btn.l{background:#eef4fb;color:#12418c;border:1.5px solid #c8d9ef}
.btn.on{background:#f5b301;color:#3b2a00}
details{background:#f6faff;border-radius:12px;padding:6px 10px;border:1px solid #dbe8f8}
summary{cursor:pointer;font-weight:700;font-size:14px;color:#12418c;padding:3px 0}
dl.info{margin:8px 0 2px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13.5px;line-height:1.5}
dl.info dt{font-weight:800;color:#0d47a1;white-space:nowrap}dl.info dd{margin:0;word-break:break-word}
.hist{font-size:13.5px;line-height:1.6;margin:6px 0;background:#fff8e6;border-radius:10px;padding:8px 10px}
.wk{font-size:13px;line-height:1.55;margin:6px 0;padding:8px 10px;background:#eef9f1;border-radius:10px}
.mapframe{width:100%;height:240px;border:0;border-radius:12px;margin-top:8px}
/* map */
#map,#mmap{height:62vh;min-height:360px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:1}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mk span{transform:rotate(45deg);font-size:15px}
.stn{width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.leaflet-popup-content{direction:rtl;text-align:right;font-family:inherit;min-width:180px}
/* sub tabs */
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.sub button{flex:0 0 auto}
/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:14px}
table.t th{background:var(--cc);color:#fff;padding:8px;text-align:right}table.t td{padding:8px;border-bottom:1px solid #e6eef9;vertical-align:top}
.pr{font-weight:800;color:#0d47a1;white-space:nowrap}
.box{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-right:6px solid var(--cc)}
.box h3{margin:0 0 6px;font-size:16px}.box ul{margin:4px 0;padding:0 18px;line-height:1.7;font-size:14px}.box p{margin:4px 0;line-height:1.6;font-size:14px}

/* ===== תחבורה ===== */
let TMAP = null;
function stationName(id) { const s = ST[id]; return `${s[1]} (${s[0]})`; }
const G = {};
Object.entries(LINES).forEach(([ln, L0]) => L0.st.forEach((s, i) => { G[s] = G[s] || []; if (i > 0) G[s].push({ to: L0.st[i - 1], line: +ln }); if (i < L0.st.length - 1) G[s].push({ to: L0.st[i + 1], line: +ln }); }));
function findRoute(a, b) {
  const key = (s, l) => s + "|" + l, dist = new Map(), prev = new Map(), pq = [[0, a, 0]];
  dist.set(key(a, 0), 0);
  while (pq.length) {
    pq.sort((x, y) => x[0] - y[0]); const [d, s, l] = pq.shift();
    if (d > (dist.get(key(s, l)) ?? 1e9)) continue;
    if (s === b) { const path = []; let k = key(s, l); while (k) { path.unshift(k); k = prev.get(k); } return path.map(k => { const [st, ln] = k.split("|"); return { st, ln: +ln }; }); }
    for (const e of G[s]) { const nd = d + 1 + (l && l !== e.line ? 6 : 0), k = key(e.to, e.line); if (nd < (dist.get(k) ?? 1e9)) { dist.set(k, nd); prev.set(k, key(s, l)); pq.push([nd, e.to, e.line]); } }
  }
  return null;
}
function routeLegs(a, b) {
  if (a === b) return null; const p = findRoute(a, b); if (!p) return null;
  const legs = []; for (let i = 1; i < p.length; i++) { const last = legs[legs.length - 1]; if (last && last.line === p[i].ln) { last.to = p[i].st; last.stops++; } else legs.push({ line: p[i].ln, from: p[i - 1].st, to: p[i].st, stops: 1 }); }
  return legs;
}
function dirOf(leg) { const L0 = LINES[leg.line], i1 = L0.st.indexOf(leg.from), i2 = L0.st.indexOf(leg.to); return i2 > i1 ? L0.to : L0.from; }
function routeHtml(a, b) {
  if (a === b) return "<p>אותה תחנה — אין צורך בנסיעה.</p>";
  const legs = routeLegs(a, b); if (!legs) return "<p>לא נמצא מסלול.</p>";
  const stops = legs.reduce((n, l) => n + l.stops, 0), mins = Math.round(stops * 2.3 + (legs.length - 1) * 5);
  return `<ol style="line-height:1.8;padding:0 20px;margin:6px 0">` + legs.map(l => `<li><b style="color:${LINES[l.line].color}">${LINES[l.line].he}</b> — מ-${stationName(l.from)} ל-${stationName(l.to)} (${l.stops} תחנות), לכיוון ${esc(dirOf(l))}</li>`).join("") + `</ol><p class="tag g">סה״כ ${stops} תחנות · כ-${mins} דקות (משוער, כולל החלפות)</p>`;
}
function routeText(a, b) {
  if (a === b) return "ללכת ברגל מהמלון"; const legs = routeLegs(a, b); if (!legs) return "";
  return legs.map(l => `${LINES[l.line].he}: ${ST[l.from][1]} ← ${ST[l.to][1]}`).join(" ⟵ ");
}

  el.innerHTML = hero("תחבורה ציבורית ודרכי הגעה", "מטרו, אוטובוסים, טראם, מוניות, השכרת רכב — ומחירים. כרטיס אחד ל-90 דקות תקף בכל אמצעי התחבורה העירוניים.") +

  if (sub === "metro") {
    box.innerHTML = `<div id="mmap"></div>
     <div class="legend">${Object.entries(LINES).map(([n, l]) => `<span class="tag" style="background:${l.color};color:#fff">${l.he}: ${esc(l.from)} ← → ${esc(l.to)}</span>`).join("")}</div>

      <input type="text" data-title="${i}" value="${esc(d.t)}" style="width:100%;margin:4px 0;padding:8px;border-radius:8px;border:1.5px solid #cfe0f5">

      <label>אחה״צ</label><textarea data-slot="${i}-2" rows="2" style="width:100%;padding:6px;border-radius:8px;border:1.5px solid #cfe0f5">${esc((d.slots[2]&&d.slots[2][1])||"")}</textarea>
      <label>ערב</label><textarea data-slot="${i}-3" rows="2" style="width:100%;padding:6px;border-radius:8px;border:1.5px solid #cfe0f5">${esc((d.slots[3]&&d.slots[3][1])||"")}</textarea>

/* ===== מידע ומזג אוויר ===== */
let WX = store.get("wx", null);
async function loadWeather() {
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.98&longitude=23.73&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=Europe%2FAthens&forecast_days=7");
    if (!r.ok) throw 0; WX = await r.json(); WX._t = Date.now(); store.set("wx", WX); updateWxStrip(); return true;
  } catch (e) { return false; }
}
function updateWxStrip() {
  const nowEl = document.getElementById("wxnow"), daysEl = document.getElementById("wxdays");
  if (!nowEl || !daysEl) return;
  if (!WX || !WX.current) { nowEl.innerHTML = "<span>🌡️</span> <b>—</b> <span>אין תחזית</span>"; return; }
  const c = WX.current, o = wxo(c.weather_code), dn = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
  nowEl.innerHTML = `<span>${o[0]}</span> <b>${Math.round(c.temperature_2m)}°</b> <span>${o[1]} · מורגש ${Math.round(c.apparent_temperature)}°</span>`;
  daysEl.innerHTML = WX.daily.time.slice(0,5).map((t,i) => {
    const d = new Date(t+"T12:00:00"), oo = wxo(WX.daily.weather_code[i]);
    return `<div class="d"><span>${i===0?"היום":dn[d.getDay()]}</span><b>${Math.round(WX.daily.temperature_2m_max[i])}°</b><small>${oo[0]}</small></div>`;
  }).join("");
}
const wxo = c => WMO[c] || WMO[Math.floor(c / 10) * 10] || ["🌡️", "—"];
function renderInfo(el) {
  el.innerHTML = hero("מידע לתייר ומזג אוויר", "תחזית לאתונה להיום ולימים הבאים, ועובדות שימושיות.") + `<div id="wxbox"></div><div class="box" style="--cc:#0288d1"><h3>🕒 השעה באתונה</h3><p id="clock" class="pr" style="font-size:22px"></p></div>
  <div class="box" style="--cc:#0288d1"><h3>עובדות שימושיות</h3>${dl(INFO_FACTS)}</div><div class="box" style="--cc:#0288d1"><h3>חיוג חירום</h3><p>112 (חירום כללי) · 100 משטרה · 166 אמבולנס · 199 כיבוי · 1571 משטרת תיירים</p></div>`;
  const draw = () => {
    const b = $("#wxbox"); if (!b) return; if (!WX || !WX.current) { b.innerHTML = '<p class="note">אין חיבור לאינטרנט — לא ניתן להציג תחזית. לחצו על ״ריענון״ כשיש חיבור.</p>'; return; }
    const c = WX.current, o = wxo(c.weather_code), dn = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"];
    b.innerHTML = `<div class="nowwx"><span class="big">${o[0]}</span><div><b>${Math.round(c.temperature_2m)}°C</b><div>${o[1]} · מורגש ${Math.round(c.apparent_temperature)}°</div><div>רוח ${Math.round(c.wind_speed_10m)} קמ״ש · לחות ${c.relative_humidity_2m}%</div></div></div>
     <div class="wx">${WX.daily.time.map((t, i) => { const d = new Date(t + "T12:00:00"), oo = wxo(WX.daily.weather_code[i]); return `<div class="wd"><div>${i === 0 ? "היום" : "יום " + dn[d.getDay()]}<br><small>${dmy(d).slice(0, 5)}</small></div><div class="big">${oo[0]}</div><b>${Math.round(WX.daily.temperature_2m_max[i])}°</b><div>${Math.round(WX.daily.temperature_2m_min[i])}°</div><small>🌧 ${WX.daily.precipitation_probability_max[i] ?? 0}%</small></div>`; }).join("")}</div>
     <p class="note">זריחה ${WX.daily.sunrise[0].slice(11)} · שקיעה ${WX.daily.sunset[0].slice(11)} · מקור: Open-Meteo. עודכן ${new Date(WX._t).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" })}</p>`;
  };
  draw(); if (!WX || Date.now() - WX._t > 3600e3) loadWeather().then(draw);
  const clk = () => { const c = $("#clock"); if (c) c.textContent = new Date().toLocaleTimeString("he-IL", { timeZone: "Europe/Athens", hour: "2-digit", minute: "2-digit" }); }; clk();
  clearInterval(window._clk); window._clk = setInterval(clk, 15000);
}

/* ===== ניווט ===== */
const RENDER = { map: renderMap, sites: el => renderSites(el, false), hotels: el => renderHotels(el, false), transport: renderTransport, rest: el => renderRest(el, false), food: el => renderFood(el, false), shop: renderShop, markets: el => renderMarkets(el, false), tips: renderTips, routes: renderRoutes, events: el => renderEvents(el, false), info: renderInfo };
function show(id) {
  cur = id; store.set("tab", id);
  $$(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === id));

}
async function refreshAll() {

function whatToDoToday() {
  const d = new Date();
  const day = d.getDay(); // 0=Sun
  const plan = store.get("plan", null);
  let html = `<h3>💡 מה עושים היום — ${dmy(d)}</h3>`;
  if (WX && WX.current) {
    const o = wxo(WX.current.weather_code);
    html += `<p class="short">${o[0]} <b>${Math.round(WX.current.temperature_2m)}°C</b> — ${o[1]}. `;
    const rain = WX.daily && WX.daily.precipitation_probability_max ? WX.daily.precipitation_probability_max[0] : 0;
    if (rain > 50) html += "סיכוי לגשם גבוה — העדיפו מוזיאונים ופנים.</p>";
    else if (WX.current.temperature_2m > 32) html += "חם מאוד — התחילו מוקדם, הפסקות צל ומים.</p>";
    else html += "מזג אוויר נוח יחסית לפעילות בחוץ.</p>";
  }
  if (plan && plan.days) {
    html += `<div class="note">יש לכם מסלול שמור של ${plan.days} ימים — עברו ללשונית ״מסלולים״ לצפייה מלאה.</div>`;
  }
  // simple day recommendations
  const recs = [];
  if (day === 0) recs.push("יום ראשון: טקס חילופי המשמר המלא בסינטגמה ב-11:00. שוק ורבקיוס סגור.");
  if (day === 1 || day === 2) recs.push("ימי שני–שלישי: פחות תיירים יחסית — זמן טוב לאקרופוליס בבוקר.");
  recs.push("בוקר: אקרופוליס או אגורה (הגיעו בפתיחה).");
  recs.push("צהריים: מוזיאון האקרופוליס או ארוחה בפלאקה.");
  recs.push("אחה״צ: ליקאבטוס / פילופאפוס לשקיעה, או שוטטות במונסטיראקי.");
  recs.push("ערב: טברנה בפסירי / פלאקה (הזמינו מראש במקומות פופולריים).");
  html += `<ul style="line-height:1.8">${recs.map(r => "<li>"+esc(r)+"</li>").join("")}</ul>
  <div class="acts"><button class="btn" id="goRoutes" style="--cc:#3949ab">🧭 למסלולים מותאמים</button>
  <button class="btn l" id="goSites">🏛️ לאתרים</button></div>`;
  const dlg = document.createElement("dialog");
  dlg.innerHTML = html + `<div class="acts" style="margin-top:10px"><button class="btn l" id="closeTd">סגור</button></div>`;
  document.body.appendChild(dlg); dlg.showModal();
  $("#closeTd", dlg).onclick = () => { dlg.close(); dlg.remove(); };
  const gr = $("#goRoutes", dlg); if (gr) gr.onclick = () => { dlg.close(); dlg.remove(); show("routes"); };
  const gs = $("#goSites", dlg); if (gs) gs.onclick = () => { dlg.close(); dlg.remove(); show("sites"); };
}

/* ===== מופע יחיד – אם כבר פתוח, ממקדים אותו ===== */
(function singleInstance() {
  try {
    const bc = new BroadcastChannel("athens-guide-lock");
    const myId = Math.random().toString(36).slice(2);
    let isPrimary = true;
    bc.postMessage({ type: "ping", id: myId });
    bc.onmessage = (ev) => {
      const m = ev.data || {};
      if (m.type === "ping" && m.id !== myId) {
        // another instance is asking – reply that we exist
        bc.postMessage({ type: "pong", id: myId });
      }
      if (m.type === "pong" && m.id !== myId) {
        // someone else is already open – ask them to focus, we can stay or close
      }
      if (m.type === "focus-request") {
        try { window.focus(); } catch (e) {}
        // flash title
        const t = document.title;
        document.title = "★ אתונה – כבר פתוח";
        setTimeout(() => document.title = t, 1500);
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          // no-op, focus is enough
        }
      }
    };
    // On load, ask others to report; if we get pong quickly, request focus on them
    let gotPong = false;
    const onPong = (ev) => {
      if (ev.data && ev.data.type === "pong" && ev.data.id !== myId) {
        gotPong = true;
        bc.postMessage({ type: "focus-request" });
      }
    };
    bc.addEventListener("message", onPong);
    setTimeout(() => bc.removeEventListener("message", onPong), 800);
    // Also handle pageshow from BFCache / launch
    window.addEventListener("pageshow", () => { try { window.focus(); } catch (e) {} });
  } catch (e) { /* BroadcastChannel not available */ }
})();

function init() {
  $("#tabs").innerHTML = TABS.map(t => `<button class="tab" data-t="${t.id}" style="--tc:${t.c}"><span>${t.i}</span>${t.t}</button>`).join("");
  $$(".tab").forEach(b => b.onclick = () => show(b.dataset.t));
  $("#refresh").onclick = refreshAll;
  $("#ver").textContent = APP_VERSION;
  const wt = document.getElementById("whatToday"); if (wt) wt.onclick = whatToDoToday;
  if (!TABS.some(t => t.id === cur)) cur = "map";
  // weather strip
  if (WX) updateWxStrip();
  loadWeather().then(updateWxStrip);
  show(cur);
  if ("serviceWorker" in navigator && (location.protocol.startsWith("http") || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
document.addEventListener("DOMContentLoaded", init);
